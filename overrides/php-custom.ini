; 【本地扩展】调高 PHP 运行限制
;
; memory_limit 默认只有 128M。内容工坊生成 2000+ 字、再过十维评分 + markdown 渲染，
; 峰值接近上限；一旦 OOM，PHP 进程被杀，nginx 就返回 502（不是 500，所以很难猜）。
memory_limit = 512M

; 长文生成可能要 1-2 分钟。默认 30 秒会让 php 自己掐断，
; 表现是请求莫名其妙中断、日志里只有 "Maximum execution time exceeded"。
max_execution_time = 300

; 输入参数数量：多平台批量 + 长文本表单，默认 1000 够用，调到 3000 留余量
max_input_vars = 3000

; 【2026-10-26 补】opcache 时间戳校验
;
; 镜像里默认 opcache.validate_timestamps=Off，意味着改了 overrides 里的 .php
; 之后，opcache 不检查文件有没有变，继续用缓存的编译产物。
; 表现就是：改了代码、跑了 optimize:clear，页面还是旧的，只有重启容器才变。
; （10-26 排查 URL 采集文案和标题生成时，两次都卡在这个假象上。）
;
; 本地开发环境打开它，改完立即生效，不用每次 restart 容器（重启会中断队列）。
; 生产环境为了性能可以关掉，但这里是本机演示环境，方便优先。
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

