x-deepseek-dns-pin: &deepseek-dns-pin
  extra_hosts:
    - "api.deepseek.com:119.188.175.46"
    - "api.deepseek.com:221.204.163.76"
    # 让容器能访问宿主机上的服务（GEO 示范页 HTTPS 预览、本地采集服务都用得上）
    - "host.docker.internal:host-gateway"

# 本地部署覆盖：所有容器共用同一份挂载（x-geo-volumes）。
# 之前只给 app 挂、没给 queue/scheduler 挂，导致队列任务跑镜像里的旧代码。
services:
  app:
    environment:
      AUTO_OPTIMIZE: "false"
    # 【GEO 诊断器接线】覆盖单个 blade 模板 + 追加路由 + 诊断引擎（不改镜像内其他文件）
    # 删除这段 volumes 即完全恢复原样。
    # 【GEO 本地覆盖】所有挂载点集中定义在文件顶部的 x-geo-volumes，
    # app / queue / scheduler 等容器共用同一份——否则队列任务跑的是镜像里的旧代码。
    volumes: *geo-volumes
    <<: *deepseek-dns-pin

  queue:
    volumes: *geo-volumes
    environment:
      AUTO_OPTIMIZE: "false"
    <<: *deepseek-dns-pin

  ai-quality-queue:
    volumes: *geo-volumes
    environment:
      AUTO_OPTIMIZE: "false"
    <<: *deepseek-dns-pin

  ai-quality-backfill-queue:
    volumes: *geo-volumes
    environment:
      AUTO_OPTIMIZE: "false"
    <<: *deepseek-dns-pin

  ai-optimization-queue:
    volumes: *geo-volumes
    environment:
      AUTO_OPTIMIZE: "false"
    <<: *deepseek-dns-pin

  knowledge-queue:
    volumes: *geo-volumes
    environment:
      AUTO_OPTIMIZE: "false"
    <<: *deepseek-dns-pin

  scheduler:
    volumes: *geo-volumes
    environment:
      AUTO_OPTIMIZE: "false"
    <<: *deepseek-dns-pin

  reverb:
    environment:
      AUTO_OPTIMIZE: "false"

  # web（nginx）原本的健康检查在 Docker Desktop 上会误报 unhealthy：
  #   test: wget -q --header='Host: ...' -O /dev/null http://127.0.0.1/up || exit 1
  # 实测证据：
  #   - 手动在容器内跑同一条命令 -> 退出码 0，nginx 访问日志有记录，返回 200
  #   - 宿主机访问 /up -> 200，耗时 0.057s
  #   - 但 Docker 健康检查连续 11 次失败，报 "wget: error getting response"，
  #     且这 11 次请求在 nginx 访问日志里完全不存在
  #   → 说明健康检查这个执行上下文里访问不到容器自身的 loopback，是 Docker Desktop
  #     （WSL2 后端）的环境特性，不是 GEOFlow 的问题，站点本身完全正常。
  # 改法：先按原方式做 HTTP 探测，失败退到 TCP 端口探测；并把命中的方式写到
  # /tmp/hc，方便日后排查（docker exec geoflow-web-prod cat /tmp/hc）。
  web:
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "if wget -q -O /dev/null --header='Host: localhost' http://127.0.0.1/up; then echo WGET >/tmp/hc; exit 0; fi; if nc -z 127.0.0.1 80; then echo NC >/tmp/hc; exit 0; fi; echo FAIL >/tmp/hc; exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
